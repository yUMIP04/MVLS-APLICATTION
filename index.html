<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVLS - Acceso remoto</title>
  <link rel="stylesheet" href="index.css">
</head>
<body class="app-body">

  <!-- Panel izquierdo -->
  <div class="left-panel">
    <div class="overlay"></div>
    <img src="logo3.png" alt="Logo" class="logo">
    <h1 class="app-title">MVLS Support</h1>
    <p class="slogan">Conecta, colabora y comparte en tiempo real.</p>
  </div>

  <!-- Panel derecho (formulario) -->
  <div class="right-panel">
    <div class="credentials-box">
      <form id="loginForm" action="">
        <h2>Iniciar Sesión</h2>
        <div class="input-group">
          <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
        </div>
        <div class="input-group">
          <input type="password" id="contraseña" name="contraseña" placeholder="Ingresa tu contraseña" required>
        </div>
        <input type="submit" value="Iniciar sesión" class="login-button">
      </form>

      <div id="mensaje"></div>
      <div id="info"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
